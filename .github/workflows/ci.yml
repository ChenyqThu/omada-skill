name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck / lint / test / build
        run: pnpm turbo run typecheck lint test build

      - name: Validate skills
        run: pnpm skill:validate --strict

      - name: Regenerate SDK from spec
        run: pnpm generate

      - name: Verify committed generated files are in sync
        run: |
          if ! git diff --exit-code packages/sdk/src/generated; then
            echo "::error::packages/sdk/src/generated/ is out of sync with specs/omada_api.json"
            echo "Run 'pnpm generate' locally and commit the result."
            exit 1
          fi
