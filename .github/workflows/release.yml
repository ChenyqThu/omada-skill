name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version / publish via changesets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Packages in this repo are still `private: true` — changesets' `publish`
      # is a no-op for them. The action still runs `changeset version` so a
      # "Version Packages" PR is opened when unreleased changesets land on
      # main. Once a package flips `private: false`, configure NPM_TOKEN and
      # this job will publish it automatically.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release:publish
          version: pnpm release:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
